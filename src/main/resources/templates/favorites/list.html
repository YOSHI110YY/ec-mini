<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>お気に入り一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<h2 class="mb-4">お気に入り一覧</h2>

<div class="row g-3" th:if="${favoriteProducts != null and !#lists.isEmpty(favoriteProducts)}">
    <div class="col-md-3" th:each="product : ${favoriteProducts}">
        <div class="card h-100">
            <a th:href="@{'/products/' + ${product.id}}">
                <img th:if="${product.image != null}"
                     th:src="@{'/uploads/product/' + ${product.image}}"
                     class="card-img-top"
                     style="height:180px; object-fit:cover;">
            </a>

            <div class="card-body">
                <h5 th:text="${product.name}"></h5>
                <p class="text-success fw-bold">
                    <span th:text="${product.price}"></span>円
                </p>
                <a th:href="@{'/products/' + ${product.id}}" class="btn btn-outline-primary w-100">
                    詳細を見る
                </a>
            </div>
        </div>
    </div>
</div>

<p th:if="${favoriteProducts == null or #lists.isEmpty(favoriteProducts)}"
   class="text-muted">
    お気に入り商品はありません。
</p>

<a href="/products" class="btn btn-secondary mt-4">商品一覧に戻る</a>

</body>
</html>
